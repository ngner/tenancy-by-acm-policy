object-templates-raw: |
  {{- range $tenant := (lookup "dusty-seahorse.io/v1alpha1" "Tenant" "tenancies" "").items }}
  {{- $tenantName := $tenant.metadata.name }}
  {{- $profile := $tenant.spec.workloadProfile | default "vms" }}
  {{- if or (eq $profile "vms") (eq $profile "both") }}
  - complianceType: mustonlyhave
    metadataComplianceType: musthave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ $tenantName }}-tenant-admin-portal-vmaas
        namespace: tenancies
        labels:
          tenant: {{ $tenantName | quote }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: tenant-portal-vmaas
      subjects:
        - kind: Group
          apiGroup: rbac.authorization.k8s.io
          name: {{ $tenant.spec.adminGroup }}
  - complianceType: mustonlyhave
    metadataComplianceType: musthave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ $tenantName }}-tenant-user-portal-vmaas
        namespace: tenancies
        labels:
          tenant: {{ $tenantName | quote }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: tenant-portal-vmaas
      subjects:
        - kind: Group
          apiGroup: rbac.authorization.k8s.io
          name: {{ $tenant.spec.userGroup }}
  {{- if $tenant.spec.viewerGroup }}
  - complianceType: mustonlyhave
    metadataComplianceType: musthave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ $tenantName }}-tenant-viewer-portal-vmaas
        namespace: tenancies
        labels:
          tenant: {{ $tenantName | quote }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: tenant-portal-vmaas
      subjects:
        - kind: Group
          apiGroup: rbac.authorization.k8s.io
          name: {{ $tenant.spec.viewerGroup }}
  {{- end }}
  {{- end }}
  {{- if or (eq $profile "containers") (eq $profile "both") }}
  - complianceType: mustonlyhave
    metadataComplianceType: musthave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ $tenantName }}-tenant-admin-portal-developer
        namespace: tenancies
        labels:
          tenant: {{ $tenantName | quote }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: tenant-portal-developer
      subjects:
        - kind: Group
          apiGroup: rbac.authorization.k8s.io
          name: {{ $tenant.spec.adminGroup }}
  - complianceType: mustonlyhave
    metadataComplianceType: musthave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ $tenantName }}-tenant-user-portal-developer
        namespace: tenancies
        labels:
          tenant: {{ $tenantName | quote }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: tenant-portal-developer
      subjects:
        - kind: Group
          apiGroup: rbac.authorization.k8s.io
          name: {{ $tenant.spec.userGroup }}
  {{- if $tenant.spec.viewerGroup }}
  - complianceType: mustonlyhave
    metadataComplianceType: musthave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ $tenantName }}-tenant-viewer-portal-developer
        namespace: tenancies
        labels:
          tenant: {{ $tenantName | quote }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: tenant-portal-developer
      subjects:
        - kind: Group
          apiGroup: rbac.authorization.k8s.io
          name: {{ $tenant.spec.viewerGroup }}
  {{- end }}
  {{- end }}
  {{- if eq $profile "clusters" }}
  - complianceType: mustonlyhave
    metadataComplianceType: musthave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ $tenantName }}-tenant-admin-portal-caas
        namespace: tenancies
        labels:
          tenant: {{ $tenantName | quote }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: tenant-portal-caas
      subjects:
        - kind: Group
          apiGroup: rbac.authorization.k8s.io
          name: {{ $tenant.spec.adminGroup }}
  - complianceType: mustonlyhave
    metadataComplianceType: musthave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ $tenantName }}-tenant-user-portal-caas
        namespace: tenancies
        labels:
          tenant: {{ $tenantName | quote }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: tenant-portal-caas
      subjects:
        - kind: Group
          apiGroup: rbac.authorization.k8s.io
          name: {{ $tenant.spec.userGroup }}
  {{- if $tenant.spec.viewerGroup }}
  - complianceType: mustonlyhave
    metadataComplianceType: musthave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ $tenantName }}-tenant-viewer-portal-caas
        namespace: tenancies
        labels:
          tenant: {{ $tenantName | quote }}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: tenant-portal-caas
      subjects:
        - kind: Group
          apiGroup: rbac.authorization.k8s.io
          name: {{ $tenant.spec.viewerGroup }}
  {{- end }}
  {{- end }}
  {{- end }}
