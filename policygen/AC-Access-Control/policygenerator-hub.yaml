---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: tenancy-ac-hub
placementBindingDefaults:
  name: binding-tenancy-hub-ac
policyDefaults:
  categories:
    - AC Access Control
  controls:
    - Enforce Tenant Access
  namespace: tenancies
  policySets:
    - tenancy-hub-access-control
  remediationAction: enforce
  severity: high
  standards:
    - Multi-Tenant Isolation
  complianceType: mustonlyhave
  consolidateManifests: false

policies:
  - name: tenancy-hub-console-and-vm-rbac
    description: >-
      Influences hub console + spokes (via MCRA): fleet VM visibility, per-tenant
      kubevirt/namespace roles, VMaaS and Developer portal RBAC.
    controls:
      - Grant Hub Console and VM Management Access
    consolidateManifests: false
    orderManifests: true
    manifests:
      - path: acm-finegrained-rbac/hub-fleet-crbs.yaml
      - path: acm-finegrained-rbac/hub-mcra-virt.yaml
      - path: acm-finegrained-rbac/hub-tenant-console-rbac.yaml

policySets:
  - name: tenancy-hub-access-control
    description: Hub and fleet RBAC for tenant console access, VM lifecycle, and namespace permissions.
    placement:
      placementName: tenancies-placement-hub-clusters
