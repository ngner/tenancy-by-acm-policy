---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: tenancy-ac-managed
placementBindingDefaults:
  name: binding-tenancy-managed-ac
policyDefaults:
  categories:
    - AC Access Control
  controls:
    - Enforce Tenant Access
  namespace: tenancies
  policySets:
    - tenancy-managed-access-control
  remediationAction: enforce
  severity: high
  standards:
    - Multi-Tenant Isolation
  complianceType: mustonlyhave
  consolidateManifests: false

policies:
  - name: tenancy-managed-custom-clusterroles
    description: >-
      Influences all spokes: tenant-ns admin/user/viewer ClusterRoles bound to
      tenant groups via hub MulticlusterRoleAssignments.
    controls:
      - Deploy Tenant Least-Privilege ClusterRoles for Tenant Namespaces
    complianceType: musthave
    manifests:
      - path: rbac/custom-clusterroles.yaml

policySets:
  - name: tenancy-managed-access-control
    description: Spoke-side least-privilege ClusterRoles consumed by hub-driven tenant RBAC.
    placement:
      placementName: tenancies-placement-managed-clusters
