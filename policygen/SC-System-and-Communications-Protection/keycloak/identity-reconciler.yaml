---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-identity-reconciler
  namespace: tenancies
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-identity-reconciler
rules:
  - apiGroups: ["config.openshift.io"]
    resources: ["oauths", "ingresses"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["dusty-seahorse.io"]
    resources: ["tenants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dusty-seahorse.io"]
    resources: ["tenants/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
  - apiGroups: ["k8s.keycloak.org"]
    resources: ["keycloakrealmimports"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-identity-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-identity-reconciler
subjects:
  - kind: ServiceAccount
    name: tenant-identity-reconciler
    namespace: tenancies
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-identity-reconciler-script
  namespace: tenancies
data:
  reconcile.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    if ! command -v jq >/dev/null 2>&1; then
      case "$(uname -m)" in
        x86_64) jq_bin=jq-linux-amd64 ;;
        aarch64|arm64) jq_bin=jq-linux-arm64 ;;
        *) echo "unsupported architecture for jq bootstrap: $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL -o /tmp/jq "https://github.com/jqlang/jq/releases/download/jq-1.7.1/${jq_bin}"
      chmod +x /tmp/jq
      export PATH="/tmp:${PATH}"
    fi

    patch_status() {
      local ns=$1 name=$2 payload=$3
      oc patch tenant "$name" -n "$ns" --subresource=status --type=merge -p "$payload" 2>/dev/null || true
    }

    KEYCLOAK_SYSTEM_NS="${KEYCLOAK_SYSTEM_NS:-keycloak-system}"

    keycloak_admin_token() {
      local kc_ns=$1 user pass host response
      kc_ns="${kc_ns:-$KEYCLOAK_SYSTEM_NS}"
      user=$(oc get secret keycloak-db-secret -n "$kc_ns" -o jsonpath='{.data.username}' 2>/dev/null | base64 -d)
      pass=$(oc get secret keycloak-db-secret -n "$kc_ns" -o jsonpath='{.data.password}' 2>/dev/null | base64 -d)
      host=$(oc get route keycloak -n "$kc_ns" -o jsonpath='{.spec.host}' 2>/dev/null)
      [ -z "$user" ] || [ -z "$pass" ] || [ -z "$host" ] && return 1
      response=$(curl -sk -X POST "https://${host}/realms/master/protocol/openid-connect/token" \
        -d "client_id=admin-cli" -d "username=${user}" -d "password=${pass}" -d "grant_type=password")
      echo "$response" | jq -r '.access_token // empty'
    }

    delete_keycloak_db_realm() {
      local realm=$1 kc_ns=$2 token host code
      kc_ns="${kc_ns:-$KEYCLOAK_SYSTEM_NS}"
      [ "$realm" = "master" ] && return 0
      host=$(oc get route keycloak -n "$kc_ns" -o jsonpath='{.spec.host}' 2>/dev/null)
      token=$(keycloak_admin_token "$kc_ns" || true)
      if [ -z "$token" ] || [ -z "$host" ]; then
        echo "Could not reach Keycloak admin API; skipping DB delete for realm ${realm}"
        return 0
      fi
      code=$(curl -sk -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $token" "https://${host}/admin/realms/${realm}")
      if [ "$code" = "200" ]; then
        echo "Deleting stale Keycloak DB realm: ${realm}"
        curl -sk -o /dev/null -X DELETE -H "Authorization: Bearer $token" "https://${host}/admin/realms/${realm}"
      fi
    }

    # Remove openshift-{tenant} IdP from oauth/cluster. Returns 0 if removed or absent.
    remove_oauth_idp_for_tenant() {
      local tenant=$1
      local oauth_json count idx cid idp_name removed
      oauth_json=$(oc get oauth cluster -o json)
      count=$(echo "$oauth_json" | jq '.spec.identityProviders | length')
      removed=0
      idx=$((count - 1))
      while [ "$idx" -ge 0 ]; do
        cid=$(echo "$oauth_json" | jq -r ".spec.identityProviders[$idx].openID.clientID // empty")
        idp_name=$(echo "$oauth_json" | jq -r ".spec.identityProviders[$idx].name // empty")
        if [ -n "$cid" ] && [ "$cid" = "openshift-${tenant}" ]; then
          echo "Removing IdP ${idp_name} (client ${cid}, tenant ${tenant})"
          if oc patch oauth cluster --type=json -p="[{\"op\":\"remove\",\"path\":\"/spec/identityProviders/${idx}\"}]"; then
            removed=1
            oauth_json=$(oc get oauth cluster -o json)
          fi
        fi
        idx=$((idx - 1))
      done
      return 0
    }

    delete_tenant_client_secret() {
      local tenant=$1
      local identity_json="${2-}"
      local secret_ns secret_name
      if [ -z "$identity_json" ]; then
        identity_json='{}'
      fi
      secret_ns=$(echo "$identity_json" | jq -r '.clientSecretRef.namespace // "openshift-config"')
      secret_name=$(echo "$identity_json" | jq -r ".clientSecretRef.name // \"${tenant}-client-secret\"")
      if oc get secret "$secret_name" -n "$secret_ns" &>/dev/null; then
        echo "Deleting client secret ${secret_ns}/${secret_name}"
        oc delete secret "$secret_name" -n "$secret_ns"
      fi
    }

    # Tear down IdP, client secret, and platform-managed Keycloak realm when SSO is disabled.
    # Do not delete keycloak-theme-* ConfigMaps or Keycloak CR volume mounts. Those
    # are installed once by apply-themes.sh and must survive tenant delete/recreate.
    cleanup_disabled_tenant_identity() {
      local name=$1 ns=$2
      local identity_json="${3-}"
      local manage_realm kc_ns realm import_ns import_name
      if [ -z "$identity_json" ]; then
        identity_json=$(oc get tenant "$name" -n "$ns" -o json | jq -c '.spec.identity // {}')
      fi
      echo "SSO disabled for tenant ${name}; cleaning up identity resources"
      remove_oauth_idp_for_tenant "$name"
      delete_tenant_client_secret "$name" "$identity_json"
      manage_realm=$(echo "$identity_json" | jq -r '.keycloak.manageRealm // false')
      if [ "$manage_realm" = "true" ]; then
        kc_ns=$(echo "$identity_json" | jq -r '.keycloak.namespace // "keycloak-system"')
        realm=$(echo "$identity_json" | jq -r ".keycloak.realm // \"${name}\"")
        import_ns="$kc_ns"
        import_name="${name}-realm-import"
        if oc get keycloakrealmimport "$import_name" -n "$import_ns" &>/dev/null; then
          echo "Deleting KeycloakRealmImport ${import_ns}/${import_name}"
          oc delete keycloakrealmimport "$import_name" -n "$import_ns" --ignore-not-found
        fi
        delete_keycloak_db_realm "$realm" "$kc_ns"
      fi
      patch_status "$ns" "$name" '{"status":{"identity":{"phase":"Disabled","message":"Console SSO disabled; IdP and client secret removed"}}}'
    }

    # Remove OpenShift OAuth IdPs and client secrets for tenants whose CR was deleted.
    # Matches IdPs created by this reconciler (openID clientID openshift-{tenant}).
    cleanup_orphan_identity_providers() {
      local oauth_json tenant_names count idx cid idp_name tenant removed
      oauth_json=$(oc get oauth cluster -o json)
      tenant_names=$(oc get tenants.dusty-seahorse.io -n tenancies -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
      count=$(echo "$oauth_json" | jq '.spec.identityProviders | length')
      removed=0
      idx=$((count - 1))
      while [ "$idx" -ge 0 ]; do
        cid=$(echo "$oauth_json" | jq -r ".spec.identityProviders[$idx].openID.clientID // empty")
        idp_name=$(echo "$oauth_json" | jq -r ".spec.identityProviders[$idx].name // empty")
        if [ -n "$cid" ] && [[ "$cid" =~ ^openshift-(.+)$ ]]; then
          tenant="${BASH_REMATCH[1]}"
          if ! echo "$tenant_names" | grep -qx "$tenant"; then
            echo "Removing orphan IdP ${idp_name} (client ${cid}, tenant ${tenant} deleted)"
            if oc patch oauth cluster --type=json -p="[{\"op\":\"remove\",\"path\":\"/spec/identityProviders/${idx}\"}]"; then
              removed=$((removed + 1))
              oauth_json=$(oc get oauth cluster -o json)
              delete_tenant_client_secret "$tenant" '{}'
              delete_keycloak_db_realm "$tenant"
            fi
          fi
        fi
        idx=$((idx - 1))
      done
      if [ "$removed" -gt 0 ]; then
        echo "Removed ${removed} orphan identity provider(s)"
      fi
    }

    # Fallback if policy prune lags: delete realm imports whose tenant CR is gone.
    cleanup_orphan_realm_imports() {
      while read -r import; do
        name=$(echo "$import" | jq -r '.metadata.name')
        ns=$(echo "$import" | jq -r '.metadata.namespace')
        tenant="${name%-realm-import}"
        if [ "$tenant" = "$name" ]; then
          continue
        fi
        if ! oc get tenant "$tenant" -n tenancies &>/dev/null; then
          echo "Deleting orphan KeycloakRealmImport ${ns}/${name}"
          oc delete keycloakrealmimport "$name" -n "$ns" --ignore-not-found
          delete_keycloak_db_realm "$tenant" "$ns"
        fi
      done < <(oc get keycloakrealmimport -A -o json 2>/dev/null | jq -c '.items[]?')
    }

    # RHBK does not remove realms from the database when the import CR is pruned.
    cleanup_orphan_keycloak_db_realms() {
      local kc_ns token host realms_json realm tenant_names import_names
      kc_ns="$KEYCLOAK_SYSTEM_NS"
      host=$(oc get route keycloak -n "$kc_ns" -o jsonpath='{.spec.host}' 2>/dev/null || true)
      token=$(keycloak_admin_token "$kc_ns" || true)
      if [ -z "$host" ] || [ -z "$token" ]; then
        echo "Skipping Keycloak DB realm sweep (admin API unavailable)"
        return 0
      fi
      tenant_names=$(oc get tenants.dusty-seahorse.io -n tenancies -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
      import_names=$(oc get keycloakrealmimport -A -o json 2>/dev/null | jq -r '.items[]? | .metadata.name' || true)
      realms_json=$(curl -sk -H "Authorization: Bearer $token" "https://${host}/admin/realms")
      echo "$realms_json" | jq -c '.[]?' | while read -r entry; do
        realm=$(echo "$entry" | jq -r '.realm // empty')
        [ -z "$realm" ] || [ "$realm" = "master" ] && continue
        if echo "$tenant_names" | grep -qx "$realm"; then
          continue
        fi
        if echo "$import_names" | grep -qx "${realm}-realm-import"; then
          continue
        fi
        delete_keycloak_db_realm "$realm" "$kc_ns"
      done
    }

    DOMAIN=$(oc get ingresses.config cluster -o jsonpath='{.spec.domain}')
    OAUTH_JSON=$(oc get oauth cluster -o json)

    oc get tenants.dusty-seahorse.io -n tenancies -o json | jq -c '.items[]' | while read -r tenant; do
      NAME=$(echo "$tenant" | jq -r '.metadata.name')
      NS=$(echo "$tenant" | jq -r '.metadata.namespace')
      IDENTITY=$(echo "$tenant" | jq -c '.spec.identity // empty')
      if [ -z "$IDENTITY" ]; then
        continue
      fi
      if [ "$(echo "$IDENTITY" | jq -r '.enabled // false')" != "true" ]; then
        cleanup_disabled_tenant_identity "$NAME" "$NS" "$IDENTITY"
        continue
      fi

      PROVIDER=$(echo "$IDENTITY" | jq -r '.provider // "keycloak"')
      IDP_NAME=$(echo "$IDENTITY" | jq -r ".consoleLoginName // \"${NAME}-idp\"")
      CLIENT_ID=$(echo "$IDENTITY" | jq -r ".clientId // \"openshift-${NAME}\"")
      SECRET_NS=$(echo "$IDENTITY" | jq -r '.clientSecretRef.namespace // "openshift-config"')
      SECRET_NAME=$(echo "$IDENTITY" | jq -r ".clientSecretRef.name // \"${NAME}-client-secret\"")
      CALLBACK="https://oauth-openshift.${DOMAIN}/oauth2callback/${IDP_NAME}"

      if ! oc get secret "$SECRET_NAME" -n "$SECRET_NS" &>/dev/null; then
        patch_status "$NS" "$NAME" "{\"status\":{\"identity\":{\"phase\":\"Error\",\"idpName\":\"${IDP_NAME}\",\"message\":\"Client secret ${SECRET_NS}/${SECRET_NAME} not found\"}}}"
        continue
      fi

      ISSUER=""
      NOTES="[]"
      if [ "$PROVIDER" = "keycloak" ]; then
        KC_NS=$(echo "$IDENTITY" | jq -r '.keycloak.namespace // "keycloak-system"')
        REALM=$(echo "$IDENTITY" | jq -r ".keycloak.realm // \"${NAME}\"")
        KC_HOST=$(oc get route keycloak -n "$KC_NS" -o jsonpath='{.spec.host}' 2>/dev/null || true)
        if [ -z "$KC_HOST" ]; then
          patch_status "$NS" "$NAME" "{\"status\":{\"identity\":{\"phase\":\"Error\",\"idpName\":\"${IDP_NAME}\",\"message\":\"Keycloak route not found in ${KC_NS}\"}}}"
          continue
        fi
        ISSUER="https://${KC_HOST}/realms/${REALM}"
      else
        ISSUER=$(echo "$IDENTITY" | jq -r '.oidc.issuer // ""')
        if [ -z "$ISSUER" ]; then
          patch_status "$NS" "$NAME" "{\"status\":{\"identity\":{\"phase\":\"Error\",\"idpName\":\"${IDP_NAME}\",\"message\":\"spec.identity.oidc.issuer is required for provider oidc\"}}}"
          continue
        fi
        NOTES=$(jq -nc --arg cb "$CALLBACK" --arg cid "$CLIENT_ID" --arg iss "$ISSUER" --arg ag "$(echo "$tenant" | jq -r '.spec.adminGroup')" \
          '[
            "Register redirect URI: " + $cb,
            "Create OIDC client with ID: " + $cid,
            "Set issuer to: " + $iss,
            "Map groups claim to tenant groups (e.g. " + $ag + ")"
          ]')
      fi

      EXISTS=$(echo "$OAUTH_JSON" | jq -r --arg n "$IDP_NAME" '[.spec.identityProviders[]? | select(.name == $n)] | length')
      if [ "$EXISTS" = "0" ]; then
        CLAIMS='{"preferredUsername":["preferred_username"],"name":["name"],"email":["email"],"groups":["groups"]}'
        if [ "$PROVIDER" = "oidc" ]; then
          G=$(echo "$IDENTITY" | jq -r '.oidc.claims.groups // "groups"')
          U=$(echo "$IDENTITY" | jq -r '.oidc.claims.preferredUsername // "preferred_username"')
          N=$(echo "$IDENTITY" | jq -r '.oidc.claims.name // "name"')
          E=$(echo "$IDENTITY" | jq -r '.oidc.claims.email // "email"')
          CLAIMS=$(jq -nc --arg g "$G" --arg u "$U" --arg n "$N" --arg e "$E" \
            '{preferredUsername:[$u],name:[$n],email:[$e],groups:[$g]}')
        fi
        PATCH=$(jq -nc \
          --arg name "$IDP_NAME" \
          --arg cid "$CLIENT_ID" \
          --arg sname "$SECRET_NAME" \
          --arg issuer "$ISSUER" \
          --argjson claims "$CLAIMS" \
          '[{op:"add",path:"/spec/identityProviders/-",value:{
            name:$name,mappingMethod:"claim",type:"OpenID",
            openID:{clientID:$cid,clientSecret:{name:$sname},claims:$claims,issuer:$issuer}
          }}]')
        if ! oc patch oauth cluster --type=json -p "$PATCH"; then
          patch_status "$NS" "$NAME" "{\"status\":{\"identity\":{\"phase\":\"Error\",\"idpName\":\"${IDP_NAME}\",\"message\":\"Failed to patch oauth/cluster\"}}}"
          continue
        fi
        OAUTH_JSON=$(oc get oauth cluster -o json)
      fi

      PHASE="Ready"
      if [ "$PROVIDER" = "oidc" ]; then
        PHASE="PendingExternalSetup"
      fi
      STATUS=$(jq -nc \
        --arg phase "$PHASE" \
        --arg idp "$IDP_NAME" \
        --arg cb "$CALLBACK" \
        --arg iss "$ISSUER" \
        --arg cid "$CLIENT_ID" \
        --argjson notes "$NOTES" \
        '{status:{identity:{phase:$phase,idpName:$idp,callbackURL:$cb,issuer:$iss,clientId:$cid,externalSetupNotes:$notes,message:"OpenShift IdP registered"}}}')
      patch_status "$NS" "$NAME" "$STATUS"
      echo "Reconciled tenant ${NAME} IdP ${IDP_NAME} (${PHASE})"
    done

    cleanup_orphan_identity_providers
    cleanup_orphan_realm_imports
    cleanup_orphan_keycloak_db_realms
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tenant-identity-reconciler
  namespace: tenancies
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: tenant-identity-reconciler
          restartPolicy: OnFailure
          containers:
            - name: reconcile
              image: quay.io/openshift/origin-cli:4.14
              command: ["/scripts/reconcile.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: tenant-identity-reconciler-script
                defaultMode: 0755
