---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: tenancy-sc-managed
placementBindingDefaults:
  name: binding-tenancy-managed-sc
policyDefaults:
  namespace: tenancies
  policySets:
    - tenancy-managed-tenant-definition
  categories:
    - SC System and Communications Protection
  controls:
    - Establish Tenant Isolation Boundary
  standards:
    - Multi-Tenant Isolation
  severity: high
  remediationAction: enforce
  consolidateManifests: false
  orderManifests: true

policies:
  - name: tenancy-managed-tenant-foundation
    description: >-
      Influences all spokes: Tenant CRD, tenancies namespace, and replication of
      Tenant CRs from hub (required before namespace/quota policies run).
    complianceType: mustonlyhave
    controls:
      - Deploy Tenant Foundation to Managed Clusters
    manifests:
      - path: tenancy/tenant-crd.yaml
      - path: tenancy/tenancies-namespace.yaml
      - path: tenancy/bridge-tenants.yaml

policySets:
  - name: tenancy-managed-tenant-definition
    description: Spoke tenant foundation — CRD, tenancies namespace, and Tenant CR sync from hub.
    placement:
      placementName: tenancies-placement-managed-clusters
