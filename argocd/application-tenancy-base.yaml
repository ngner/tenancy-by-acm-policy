---
# tenancy-base syncs tenancies/ which is intentionally empty.
# Sample tenants are NOT GitOps-managed — create via Create Tenant UI or:
#   examples/apply-samples.sh
# prune must stay false: with an empty path, prune:true deletes any live Tenant CRs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenancy-base
  namespace: openshift-gitops
spec:
  destination:
    namespace: tenancies
    server: https://kubernetes.default.svc
  project: tenancy-policy
  source:
    path: tenancies
    repoURL: https://github.com/ngner/tenancy-by-acm-policy.git
    targetRevision: master
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    automated:
      prune: false
      selfHeal: true
